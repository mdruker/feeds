name: deploy

# Build the existing Dockerfile, push to GHCR, and redeploy the box.
# The feed has no test suite, so this triggers directly on push to main.
# (fly deploys are manual via CLI, so this doesn't disturb the fly app.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-feeds
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mdruker/feeds

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (linux/amd64 — the box's arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on the box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # App pinned server-side in authorized_keys (deploy.sh feeds).
          script: feeds
